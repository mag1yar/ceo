[package]
name = "ceo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ceo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }

[dev-dependencies]
serde_json = "1.0"
