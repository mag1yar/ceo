[package]
name = "ceo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ceo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ts-rs = "12"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSArray", "NSGeometry", "NSString"] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12.5", features = ["macos-private-api", "test"] }

[features]
# Hidden, WebDriver-driven test build; never enabled by `pnpm dev` or release builds.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
